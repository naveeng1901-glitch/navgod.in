<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NavGod Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Packaging lookbook. Each project wears its brand colours (theme in projects.json).
   Images sit as a tight mosaic (edge to edge, hairline gaps); the brand's own shapes carry the palette:
   peaks for Altura, wedges for Eleftheria, donuts for Donut Protocol, boxes, tags. */
:root{
  --bg:#ece8e2; --ink:#1c1a17; --soft:#6d6a66; --accent:#8a3b1e; --card:#f6f3ee; --paper:#fbfaf7;
  --rule:color-mix(in srgb,var(--ink) 18%,transparent);
  --g:clamp(16px,4vw,56px); --max:1520px; --gap:clamp(6px,.7vw,10px); --sp:clamp(56px,9vw,144px);
  --display:"Bricolage Grotesque",system-ui,sans-serif; --serif:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.6 var(--display);font-variation-settings:"opsz" 14;-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:auto}
a{color:inherit}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--g)}
.full{max-width:var(--max);margin:0 auto}
figure{margin:0}
.cap{font-size:14px;color:var(--soft);padding-top:10px}

/* top line */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 0;font-size:15px}
.top a{text-decoration:none}.top a:hover{text-decoration:underline;text-underline-offset:4px}
.top .where{color:var(--soft)}

/* cover */
.cover img{aspect-ratio:16/9;object-fit:cover}

/* title */
.head{display:grid;grid-template-columns:7fr 5fr;gap:24px clamp(24px,4vw,72px);padding:clamp(28px,4vw,56px) 0 var(--sp);align-items:end}
h1{margin:0;font-weight:700;font-size:clamp(52px,9.5vw,152px);line-height:.88;letter-spacing:-.035em;font-variation-settings:"opsz" 96}
.sub{margin:14px 0 0;font-size:clamp(18px,1.7vw,22px);color:var(--soft)}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:15px;line-height:1.45;border-top:1px solid var(--rule);padding-top:16px}
.facts dt{color:var(--soft)}.facts dd{margin:0}

/* concept */
.idea{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;padding-bottom:var(--sp)}
.idea blockquote{grid-column:1/10;margin:0;font:italic 400 clamp(32px,4.6vw,68px)/1.04 var(--serif);letter-spacing:-.01em}
.idea .body{grid-column:6/12;margin-top:clamp(24px,3vw,44px);max-width:58ch}
.idea .body p{margin:0 0 1em}

/* mosaic: wide photograph + tall crop of the next, same height */
.mosaic{display:grid;grid-template-columns:2fr 1fr;gap:var(--gap)}
.mosaic img{height:100%;object-fit:cover}
.mosaic .wide img{aspect-ratio:16/9}
.row-cap{display:flex;justify-content:space-between;gap:16px}
.sec{padding-bottom:var(--sp)}

/* identity: mark | type printed on the brand colour, drawing */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px}
.sec-h h2{margin:0;font-weight:500;font-size:clamp(24px,2.4vw,34px);letter-spacing:-.015em}
.sec-h p{margin:0;color:var(--soft);font-size:15px;text-align:right;max-width:48ch}
.ident{display:grid;grid-template-columns:7fr 5fr;gap:var(--gap)}
.ident .side{display:grid;grid-template-rows:1fr 1fr;gap:var(--gap)}
.ident .mark img{height:100%;object-fit:cover}
.panel{background:var(--card);display:grid;place-items:center;overflow:hidden}
.panel img{height:100%;object-fit:cover}
.panel.type img,.panel.art.on-paper img{object-fit:contain;padding:clamp(8px,2vw,28px) clamp(8px,1.6vw,20px)}
.light .panel.type img,.light .panel.art.on-paper img{mix-blend-mode:multiply}
.dark .panel.type img{filter:invert(1);mix-blend-mode:screen}

/* palette in the brand's own shapes */
.swatches{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:clamp(12px,2vw,32px);align-items:end;background:var(--card);padding:clamp(24px,4vw,64px) clamp(16px,4vw,64px) clamp(20px,3vw,40px)}
.sw .s{filter:drop-shadow(0 0 .6px color-mix(in srgb,var(--ink) 45%,transparent))}
.sw i{display:block;width:100%;background:var(--c)}
.sw p{margin:12px 0 0;font-size:14px;line-height:1.35}
.sw small{display:block;color:var(--soft);font-variant-numeric:tabular-nums;font-size:13px}
[data-shape=box] .sw i{aspect-ratio:1/2.6;max-width:110px;margin:0 auto}
[data-shape=peak] .sw i{aspect-ratio:2/1;clip-path:polygon(0 100%,16% 64%,24% 70%,40% 34%,50% 6%,58% 22%,66% 16%,80% 54%,88% 50%,100% 100%)}
[data-shape=wedge] .sw i{aspect-ratio:1.15/1;clip-path:polygon(0 0,100% 0,50% 100%)}
[data-shape=matchbox] .sw i{aspect-ratio:53/36;box-shadow:inset 0 0 0 7px var(--c),inset 0 0 0 9px rgba(255,255,255,.75)}
[data-shape=tag] .sw i{aspect-ratio:.56/1;max-width:120px;margin:0 auto;border-radius:10px;-webkit-mask:radial-gradient(circle at 50% 11%,transparent 6px,#000 6.5px);mask:radial-gradient(circle at 50% 11%,transparent 6px,#000 6.5px)}
[data-shape=dot] .sw i{aspect-ratio:1;max-width:130px;margin:0 auto;border-radius:50%}   /* the kolam's dots */
[data-shape=sticker] .sw i{aspect-ratio:1;max-width:150px;margin:0 auto;border-radius:22%;box-shadow:0 0 0 7px #fff}
[data-shape=sticker] .sw:nth-child(odd) .s{transform:rotate(-5deg)}[data-shape=sticker] .sw:nth-child(even) .s{transform:rotate(4deg)}
[data-shape=note] .sw i{aspect-ratio:2.27/1;border-radius:3px;box-shadow:inset 0 0 0 5px rgba(255,255,255,.22),inset 0 0 0 6px rgba(0,0,0,.25)}   /* a banknote */
[data-shape=record] .sw i{aspect-ratio:1;max-width:160px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,#0c0b10 0 3%,var(--c) 3.6% 40%,#141216 41%) ,#141216;box-shadow:inset 0 0 0 1px #000}   /* a vinyl record, the colour as its label */
[data-shape=record] .sw i::after{content:'';display:block;width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 41%,rgba(255,255,255,.05) 41.3% 41.6%,transparent 42% 44%);}
[data-shape=donut] .sw i{aspect-ratio:1;max-width:170px;margin:0 auto;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 19%,#000 19.5%);mask:radial-gradient(circle,transparent 19%,#000 19.5%)}

/* structure: proof sheet */
.sheet{background:var(--paper);padding:clamp(12px,2.4vw,36px);display:grid;gap:clamp(12px,2vw,28px);grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:start}
.sheet img{max-height:min(70vh,640px);object-fit:contain;object-position:left top}
.sheet .cap{color:#77736c}
.sheet:has(> figure:nth-child(4):last-child){grid-template-columns:repeat(2,minmax(0,1fr));max-width:1000px;margin-inline:auto}   /* four pieces sit 2 × 2, not 3 + 1 */

/* out in the world: one row, every photograph the same height */
.inuse{display:flex;gap:var(--gap);align-items:flex-start;margin:0 auto}
.inuse figure{flex:var(--a) 1 0;min-width:0}
.inuse img{aspect-ratio:var(--a);object-fit:cover}


/* campaign case studies: big idea, key creative, media by role, the world, the series */
.insight{grid-column:1/-1;margin:clamp(28px,4vw,56px) 0 0;font:italic 400 clamp(22px,2.6vw,36px)/1.2 var(--serif);color:var(--soft);max-width:30ch}
.keyc{display:grid;grid-template-columns:5fr 6fr;gap:clamp(24px,4vw,72px);align-items:center}
.keyc img{max-height:84vh;width:auto;max-width:100%;margin:0 auto}
.keyc h3{margin:0 0 18px;font-weight:600;font-size:clamp(30px,3.6vw,54px);line-height:1;letter-spacing:-.02em}
.keyc p{margin:0 0 22px;max-width:52ch}
.keyc dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:15px;border-top:1px solid var(--rule);padding-top:16px}
.keyc dt{color:var(--soft)}.keyc dd{margin:0}
.medium{display:grid;grid-template-columns:4fr 8fr;gap:clamp(20px,3vw,48px);align-items:start;padding-bottom:clamp(36px,5vw,72px)}
.medium .role{font:italic 400 clamp(34px,4vw,60px)/1 var(--serif);color:var(--accent);margin:0 0 10px}
.medium h3{margin:0 0 10px;font-weight:600;font-size:20px}
.medium p{margin:0;color:var(--soft);max-width:44ch}
.stack{display:grid;gap:var(--gap)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.grid3 img{aspect-ratio:2/3;object-fit:cover}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,48px);border-top:1px solid var(--rule);padding-top:24px}
.who h3{margin:0 0 8px;font-weight:600;font-size:19px}.who p{margin:0;color:var(--soft);font-size:15.5px}
@media (max-width:820px){ .keyc,.medium,.who{grid-template-columns:1fr} .grid3{grid-template-columns:1fr 1fr} }
/* closing */
.closing img{aspect-ratio:16/9;object-fit:cover}

/* next */
.next{display:grid;grid-template-columns:1fr minmax(160px,340px);gap:24px;align-items:end;border-top:1px solid var(--rule);padding:22px 0 40px;text-decoration:none;margin-top:var(--sp)}
.next .lbl{color:var(--soft);font-size:15px}
.next .t{display:block;font-weight:700;font-size:clamp(40px,6vw,96px);line-height:.92;letter-spacing:-.03em;font-variation-settings:"opsz" 96;margin-top:6px}
.next:hover .t{color:var(--accent)}
.next img{aspect-ratio:16/10;object-fit:cover}
.prev{display:inline-block;font-size:15px;color:var(--soft);margin-bottom:56px}

@media (max-width:820px){
  .head,.ident,.mosaic{grid-template-columns:1fr}
  .mosaic .tall img{aspect-ratio:4/5}
  .ident .side{grid-template-rows:auto}
  .idea blockquote,.idea .body{grid-column:1/-1}
  .swatches{grid-template-columns:repeat(min(var(--n),3),1fr)}
  .sec-h,.row-cap{flex-direction:column;gap:4px}.sec-h p{text-align:left}
  .next{grid-template-columns:1fr}
  .inuse{flex-direction:column;max-width:none!important}.inuse figure{flex:none;width:100%}
}
</style>
</head>
<body>
<div class="wrap"><nav class="top"><a href="index.html">Naveen Godugupalli</a><span class="where" id="where"></span><a href="index.html">All work</a></nav></div>
<main id="page"></main>
<script>
(async () => {
  const data = await fetch('assets/case/projects.json').then(r => r.json());
  const qs = new URLSearchParams(location.search), slug = qs.get('p') || data[0].slug;
  const EMBED = qs.has('embed') && window.parent !== window, keep = EMBED ? '&embed=1' : '';
  if (EMBED) {   // inside the museum: the top links close the case and return to the hall
    document.querySelectorAll('.top a').forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); window.parent.postMessage('navgod-close-case', '*'); }));
    document.querySelector('.top a:last-child').hidden = true;   // the museum's own floating button takes you back
  }
  const i = Math.max(0, data.findIndex(d => d.slug === slug)), p = data[i], base = `assets/case/${p.slug}/`;
  for (const [k, v] of Object.entries(p.theme || {})) document.documentElement.style.setProperty('--' + k, v);
  const lum = h => parseInt(h.slice(1, 3), 16) * .3 + parseInt(h.slice(3, 5), 16) * .59 + parseInt(h.slice(5, 7), 16) * .11;
  document.body.classList.add(lum(p.theme.bg) < 110 ? 'dark' : 'light');
  document.title = `${p.title}, ${(p.cat || 'Packaging').toLowerCase()} by Naveen Godugupalli`;
  const cat = p.cat || 'Packaging', group = data.filter(d => (d.cat || 'Packaging') === cat);
  document.getElementById('where').textContent = `${cat}, ${group.indexOf(p) + 1} of ${group.length}`;
  const e = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const list = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  const [cover, shotA, shotB] = p.imgs, [mark, typ, art] = p.brand || [];
  // where the tall crop of the second photograph should look (x %), per project
  const FOCUS = { kazaar: 62, altura: 38, eleftheria: 70, misty: 50, playable: 48, donut: 50, brain: 45, forkyeah: 50, currency: 50, albums: 36 };
  const SHAPE = { kazaar: 'box', altura: 'peak', eleftheria: 'wedge', misty: 'matchbox', playable: 'tag', donut: 'donut', brain: 'dot', forkyeah: 'sticker', currency: 'note', albums: 'record' };
  const ART_ON_PAPER = { altura: 1, eleftheria: 1, playable: 1, forkyeah: 1 };
  const prev = data[(i + data.length - 1) % data.length], next = data[(i + 1) % data.length];
  const img = (im, cls = '', st = '') => `<img src="${base + im.src}" alt="${e(im.cap)}" loading="lazy"${st ? ` style="${st}"` : ''}>`;
  if (p.key) {   // a campaign: the big idea, the key creative, then each medium by what it asks people to do
    const fig = (im, st = '') => `<figure>${img(im, '', st)}<figcaption class="cap">${e(im.cap)}</figcaption></figure>`;
        const T = p.traditional, Dg = p.digital;
    document.getElementById('page').innerHTML = `
    <div class="full cover"><img src="${base + cover.src}" alt="${e(cover.cap)}"></div>
    <div class="wrap">
      <header class="head">
        <div><h1>${e(p.title)}</h1><p class="sub">${e(p.sub)}</p></div>
        <dl class="facts"><dt>Year</dt><dd>${e(p.year)}</dd><dt>Brief</dt><dd>${e(p.format)}</dd><dt>Work</dt><dd>${e(p.role)}</dd></dl>
      </header>
      <section class="idea"><blockquote>${e(p.lede)}</blockquote><div class="body">${p.body.map(t => `<p>${e(t)}</p>`).join('')}</div><p class="insight">${e(p.insight)}</p></section>
    </div>
    <section class="sec wrap"><div class="sec-h"><h2>The cloth</h2><p>Six looks, six places, one fabric.</p></div>
      <div class="grid3">${p.series.map(im => fig(im)).join('')}</div></section>
    <section class="sec wrap"><div class="sec-h"><h2>${e(p.show.title)}</h2><p>Ryndia Runway, December 2026.</p></div>
      <div class="mosaic"><figure class="wide">${img(p.show)}</figure><figure class="tall">${img(p.museum, '', 'object-position:52% 50%')}</figure></div>
      <div class="row-cap cap"><span>${e(p.show.cap)}</span><span>${e(p.museum.cap)}</span></div>
      <div class="idea" style="padding:clamp(24px,3vw,40px) 0 0"><div class="body" style="grid-column:1/9;margin:0">${p.show.text.map(t => `<p>${e(t)}</p>`).join('')}${EMBED ? `<p><a href="#" onclick="window.parent.postMessage('navgod-close-case','*');return false" style="color:var(--accent)">Back to the runway →</a></p>` : ''}</div></div></section>
    <section class="sec wrap"><div class="sec-h"><h2>The invitation</h2><p>One poster announces the show.</p></div>
      <div class="keyc"><figure>${img(p.key)}</figure><div><h3>${e(p.key.title)}</h3><p>${e(p.key.text)}</p><dl>${p.key.lines.map(([k, v]) => `<dt>${e(k)}</dt><dd>${e(v)}</dd>`).join('')}</dl></div></div>
      <div class="inuse" style="margin-top:clamp(40px,5vw,80px);max-width:calc(${p.world.reduce((t, im) => t + im.a, 0)} * min(60vh, 560px) + ${p.world.length - 1} * var(--gap))">${p.world.map(im => `<figure style="--a:${im.a}">${img(im)}<figcaption class="cap">${e(im.cap)}</figcaption></figure>`).join('')}</div></section>
    <section class="sec wrap"><div class="sec-h"><h2>Every medium</h2><p>Each does what only it can, and all of them point to the show.</p></div>
      <div class="sheet">${[...T, ...Dg].map(m => `<figure>${img(m)}<figcaption class="cap">${e(m.title ? m.title + '. ' + m.cap : m.cap)}</figcaption></figure>`).join('')}</div></section>
    <div class="full closing">${img({ src: p.closing.src, cap: 'Meghalaya' })}</div>
    <div class="wrap">
      <a class="next" href="?p=${next.slug}${keep}"><span><span class="lbl">Next project</span><span class="t">${e(next.title)}</span></span><img src="assets/case/${next.slug}/${next.imgs[0].src}" alt="" loading="lazy"></a>
      <a class="prev" href="?p=${prev.slug}${keep}">Back to ${e(prev.title)}</a>
    </div>`;
    return;
  }
  document.getElementById('page').innerHTML = `
    <div class="full cover"><img src="${base + cover.src}" alt="${e(cover.cap)}"></div>
    <div class="wrap">
      <header class="head">
        <div><h1>${e(p.title)}</h1><p class="sub">${e(p.sub)}</p></div>
        <dl class="facts"><dt>Year</dt><dd>${e(p.year)}</dd><dt>Object</dt><dd>${e(p.format)}</dd><dt>Work</dt><dd>${e(p.role)}</dd></dl>
      </header>
      <section class="idea"><blockquote>${e(p.lede)}</blockquote><div class="body">${p.body.map(t => `<p>${e(t)}</p>`).join('')}</div></section>
    </div>
    ${shotA && shotB ? `<section class="sec wrap">
      <div class="mosaic"><figure class="wide">${img(shotA)}</figure><figure class="tall">${img(shotB, '', `object-position:${FOCUS[p.slug] ?? 50}% 50%`)}</figure></div>
      <div class="row-cap cap"><span>${e(shotA.cap)}</span><span>${e(shotB.cap)}</span></div>
    </section>` : ''}
    ${mark ? `<section class="sec wrap">
      <div class="sec-h"><h2>Identity</h2><p>${e(mark.cap)}</p></div>
      <div class="ident">
        <figure class="mark">${img(mark)}</figure>
        <div class="side">
          <figure class="panel type">${img(typ)}</figure>
          <figure class="panel art${ART_ON_PAPER[p.slug] ? ' on-paper' : ''}">${img(art)}</figure>
        </div>
      </div>
      <div class="row-cap cap"><span>${e(typ.cap)}</span><span>${e(art.cap)}</span></div>
    </section>` : ''}
    <section class="sec wrap">
      <div class="sec-h"><h2>Colour</h2><p>Set in ${e(list(p.type))}.</p></div>
      <div class="swatches" data-shape="${SHAPE[p.slug] || 'box'}" style="--n:${p.palette.length}">
        ${p.palette.map(c => `<div class="sw" style="--c:${c.hex}"><div class="s"><i></i></div><p>${e(c.name)}<small>${c.hex.toUpperCase()}</small></p></div>`).join('')}
      </div>
    </section>
    <section class="sec wrap">
      <div class="sec-h"><h2>Every side, flat</h2><p>${e(p.kind)}</p></div>
      <div class="sheet">${p.structure.map(im => `<figure>${img(im)}<figcaption class="cap">${e(im.cap)}</figcaption></figure>`).join('')}</div>
    </section>
    ${p.inuse?.length ? `<section class="sec wrap">
      <div class="sec-h"><h2>Out in the world</h2><p>${e(p.sub)}</p></div>
      <div class="inuse" style="max-width:calc(${p.inuse.reduce((t, im) => t + im.a, 0)} * min(76vh, 720px) + ${p.inuse.length - 1} * var(--gap))">${p.inuse.map(im => `<figure style="--a:${im.a}">${img(im)}<figcaption class="cap">${e(im.cap)}</figcaption></figure>`).join('')}</div>
    </section>` : ''}
    ${p.closing ? `<div class="full closing">${img({ src: p.closing.src, cap: p.title + ', closing image' })}</div>` : ''}
    <div class="wrap">
      <a class="next" href="?p=${next.slug}${keep}"><span><span class="lbl">Next project</span><span class="t">${e(next.title)}</span></span><img src="assets/case/${next.slug}/${next.imgs[0].src}" alt="" loading="lazy"></a>
      <a class="prev" href="?p=${prev.slug}${keep}">Back to ${e(prev.title)}</a>
    </div>`;
})();
</script>
</body>
</html>
